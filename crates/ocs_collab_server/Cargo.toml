[package]
name = "ocs_collab_server"
version = "0.1.0"
edition = "2021"
publish = false

# Collaboration server binary: axum HTTP control plane + WebSocket data plane,
# with rusqlite persistence. The protocol and the pure state machines live in
# `ocs_collab`; nothing here is shared with the desktop client.

[dependencies]
ocs_collab = { path = "../ocs_collab" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
