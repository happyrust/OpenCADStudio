name: Workspace check

# Compile gate on Linux, Windows and macOS (pushes to main; PRs skip macOS
# since its 7 GB runner swaps through the main crate's build, #3059). This fork
# keeps iced, cryoglyph, bevy and the e3d readers beside the repository as path
# dependencies; the shared action materialises them at the pinned commits first.
#
# The workspace test targets currently lag the pinned dependency APIs, so the
# test run is informational until those sources are updated; the compile step
# is the blocking gate. Separate lint and health jobs report results without
# blocking merges.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04","windows-latest"]' || '["ubuntu-22.04","windows-latest","macos-15"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pid-cad

      # This fork keeps iced, bevy and the e3d readers beside the repository
      # as path dependencies; materialise them before cargo runs.
      - uses: ./pid-cad/.github/actions/checkout-fork-deps

      # The same libraries the Linux release build needs (windowing, GL,
      # fonts); the packaging tools are left out.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pid-cad -> target

      - name: cargo check
        working-directory: pid-cad
        run: cargo check --workspace --locked

      # LC_ALL=C: a few tests compare English message text. The GPU-backed
      # tests are #[ignore]d and need an adapter, so they do not run here.
      - name: cargo test (informational)
        if: runner.os == 'Linux'
        working-directory: pid-cad
        continue-on-error: true
        env:
          LC_ALL: C
        run: cargo test --workspace --locked

      - name: Runner memory (macOS)
        if: always() && runner.os == 'macOS'
        run: sysctl hw.memsize vm.swapusage

  lint:
    name: lint (informational)
    runs-on: ubuntu-22.04
    # Non-blocking until the existing tree is cleaned up. The tree currently has
    # thousands of rustfmt diffs and several clippy warnings and errors, so
    # these checks report in the log without failing the job: a job-level
    # continue-on-error still shows a red check on every pull request.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pid-cad
          # The first parent of a pull request's merge commit is its base,
          # for the list of files the pull request touches.
          fetch-depth: 2

      - uses: ./pid-cad/.github/actions/checkout-fork-deps

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pid-cad -> target

      - name: cargo fmt --check
        working-directory: pid-cad
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: pid-cad
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

      # Reports a file built on the UI kit that gains generic iced colours or literal
      # sizes (see src/ui/kit/mod.rs); the counts in
      # docs/ui/audit_counts.txt only go down.
      - name: kit audit
        working-directory: pid-cad
        continue-on-error: true
        run: sh docs/ui/audit_counts.sh --check

      # The whole tree has too many warnings for a list to help, so the
      # summary shows only those in the files this pull request touches.
      - name: Warnings in the files this pull request touches
        if: github.event_name == 'pull_request'
        working-directory: pid-cad
        continue-on-error: true
        run: |
          cargo clippy --workspace --all-targets --locked --message-format=json > "$RUNNER_TEMP/clippy.json" || true
          cargo fmt --all -- --check -l > "$RUNNER_TEMP/fmt.txt" || true
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          python3 scripts/health.py lint "$RUNNER_TEMP/clippy.json" "$RUNNER_TEMP/fmt.txt" "$RUNNER_TEMP/changed.txt" --markdown >> "$GITHUB_STEP_SUMMARY"

  health:
    name: health (informational)
    runs-on: ubuntu-22.04
    # Compares a pull request with the commit it merges into on the source
    # measures in docs/architecture/HEALTH.md (upward dependencies, module
    # pairs that use each other, large files and functions, panic sites,
    # undocumented unsafe, test functions) and lists what got better and what
    # got worse, plus edited files that have no tests yet, in
    # the job summary and as warnings on the lines. Like the lint job it never
    # fails: every step carries continue-on-error.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base the report compares against.
          fetch-depth: 2

      - name: Tool tests
        continue-on-error: true
        run: |
          python3 scripts/test_arch_check.py
          python3 scripts/test_health.py

      - name: What this pull request changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          # Files with no tests as of the last release, published by the wiki
          # job; before the first such release the list is empty.
          curl -fsSL "https://raw.githubusercontent.com/wiki/${GITHUB_REPOSITORY}/health/untested.json" \
            -o "$RUNNER_TEMP/untested.json" || echo "[]" > "$RUNNER_TEMP/untested.json"
          python3 scripts/health.py diff "$RUNNER_TEMP/base" --markdown --untested "$RUNNER_TEMP/untested.json" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/health.py diff "$RUNNER_TEMP/base"

      - name: Upward dependencies
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 scripts/arch_check.py report --markdown >> "$GITHUB_STEP_SUMMARY"
