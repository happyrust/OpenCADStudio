name: Web build check

# The web bundle is only built when a release is published (pages.yml), so a
# desktop-only call in shared code can sit on main unnoticed until the next
# release fails at the wasm step. Type-check the web target on every change
# instead; this is a check, not a bundle build, so it stays fast.
#
# This fork leaves the web target out of CI for now, so the check runs only
# when started by hand (Actions > Web build check > Run workflow). The web
# target does not compile at present. uuid stops first: ocs_collab makes v4
# ids, and on wasm32-unknown-unknown uuid has no source of randomness until
# one of its features names one. Behind it the application calls desktop-only
# code in nine places (SVG export, Scene::add_entities, the collaboration
# client's settings). To check every change again, put back
#   push:
#     branches: [main]
#   pull_request:

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pid-cad

      - uses: ./pid-cad/.github/actions/checkout-fork-deps

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pid-cad -> target

      # The app and the parse worker that trunk's post-build hook compiles.
      - name: cargo check (wasm32)
        working-directory: pid-cad
        run: cargo check --locked --target wasm32-unknown-unknown -p OpenCADStudio -p ocs_web_worker
